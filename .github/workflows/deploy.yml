name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate and validate pages
        run: |
          python3 tools/build_site.py
          python3 tools/check_site.py
          python3 tools/check_performance.py
          node tools/check_preferences.cjs

      - name: Prepare site
        run: |
          mkdir _site
          cp ./*.html style.css theme.js robots.txt sitemap.xml avatar.jpg favicon.svg _site/
          cp -R assets de projects _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
